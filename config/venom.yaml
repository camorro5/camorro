# VenomScan Configuration

general:
  threads: 10
  timeout: 10
  user_agent: "random"
  verify_ssl: false
  follow_redirects: true

scanning:
  sql_injection: true
  xss: true
  lfi: true
  csrf: true
  command_injection: true
  disclosure: true
  port_scan: false

brute_force:
  concurrency: 5
  delay: 1.0
  default_passwords:
    - admin
    - admin123
    - password
    - 123456
    - administrator
    - joomla
    - abc123
    - napoli

evasion:
  user_agent_rotation: true
  random_delay: true
  min_delay: 0.05
  max_delay: 0.5
  proxy_rotation: false
  proxy_file: "data/proxies.txt"

llm:
  enabled: false
  model_path: "models/mistral-7b-instruct.Q4_K_M.gguf"

reporting:
  output_dir: "data/"
  formats:
    - json
    - html
    - txt
